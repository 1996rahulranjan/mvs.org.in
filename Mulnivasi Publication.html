<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MVS Publications</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    min-height:100vh;
    padding:30px;
    color:white;
}

.container{
    max-width:1400px;
    margin:auto;

    background:rgba(255,255,255,0.05);

    backdrop-filter:blur(15px);

    border:1px solid rgba(255,255,255,0.08);

    border-radius:25px;

    padding:40px;
}

/* Logo Section */

.hero{
    display:flex;
    justify-content:center;
    align-items:center;
    margin-bottom:25px;
}

.logo{
    width:180px;
    height:180px;

    background:white;

    border-radius:50%;

    padding:12px;

    object-fit:contain;

    box-shadow:0 15px 40px rgba(0,0,0,.4);
}

/* Heading */

h1{
    text-align:center;
    font-size:3rem;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#cbd5e1;
    margin-bottom:35px;
    font-size:1.05rem;
}

/* Newspaper */

.book{
    max-width:900px;
    margin:auto;

    background:white;

    border-radius:20px;

    overflow:hidden;

    box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.book img{
    width:100%;
    display:block;

    transition:0.4s ease;
}

/* Controls */

.controls{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:15px;

    flex-wrap:wrap;

    margin-top:25px;
}

button{

    padding:12px 24px;

    border:none;

    border-radius:50px;

    background:#2563eb;

    color:white;

    cursor:pointer;

    font-weight:600;

    transition:.3s;
}

button:hover{

    background:#1d4ed8;

    transform:translateY(-2px);
}

.page-info{

    font-size:18px;

    font-weight:bold;

    min-width:90px;

    text-align:center;
}

/* Mobile */

@media(max-width:768px){

    .container{
        padding:20px;
    }

    .logo{
        width:120px;
        height:120px;
    }

    h1{
        font-size:2rem;
    }

    .subtitle{
        font-size:14px;
    }

    button{
        width:100%;
    }

    .controls{
        flex-direction:column;
    }

}

</style>
</head>
<body>

<div class="container">

    <!-- Logo -->

    <div class="hero">
        <img src="mvs_logo.png" class="logo" alt="MVS Logo">
    </div>

    <!-- Heading -->

    <h1>📰 Latest Publications</h1>

    <p class="subtitle">
        Explore Mulnivasi Vidyarthi Sangh Newspapers, Reports and Publications
    </p>

    <!-- Newspaper Viewer -->

    <div class="book">

        <img
        id="pageImage"
        src="H:\MVS File\Website\Mulnivasi Publication\ilovepdf_pages-to-jpg (2)\Mulnivasi Publication_page-0001.jpg" alt="Newspaper">


here are link of news paper image in series


    </div>

    <!-- Controls -->

    <div class="controls">

        <button onclick="prevPage()">
            ⬅ Previous
        </button>

        <div class="page-info" id="pageNumber">
            1 / 12
        </div>

        <button onclick="nextPage()">
            Next ➡
        </button>

    </div>

</div>

<script>

const pages = [

"H:\MVS File\Website\Mulnivasi Publication\ilovepdf_pages-to-jpg (2)\Mulnivasi Publication_page-0001.jpg"
"H:\MVS File\Website\Mulnivasi Publication\ilovepdf_pages-to-jpg (2)\Mulnivasi Publication_page-0002.jpg"
"H:\MVS File\Website\Mulnivasi Publication\ilovepdf_pages-to-jpg (2)\Mulnivasi Publication_page-0003.jpg"
"H:\MVS File\Website\Mulnivasi Publication\ilovepdf_pages-to-jpg (2)\Mulnivasi Publication_page-0004.jpg"
"H:\MVS File\Website\Mulnivasi Publication\ilovepdf_pages-to-jpg (2)\Mulnivasi Publication_page-0005.jpg"
"H:\MVS File\Website\Mulnivasi Publication\ilovepdf_pages-to-jpg (2)\Mulnivasi Publication_page-0006.jpg"
"H:\MVS File\Website\Mulnivasi Publication\ilovepdf_pages-to-jpg (2)\Mulnivasi Publication_page-0007.jpg"
"H:\MVS File\Website\Mulnivasi Publication\ilovepdf_pages-to-jpg (2)\Mulnivasi Publication_page-0008.jpg"
"H:\MVS File\Website\Mulnivasi Publication\ilovepdf_pages-to-jpg (2)\Mulnivasi Publication_page-0009.jpg"
"H:\MVS File\Website\Mulnivasi Publication\ilovepdf_pages-to-jpg (2)\Mulnivasi Publication_page-0010.jpg"
"H:\MVS File\Website\Mulnivasi Publication\ilovepdf_pages-to-jpg (2)\Mulnivasi Publication_page-0011.jpg"
"H:\MVS File\Website\Mulnivasi Publication\ilovepdf_pages-to-jpg (2)\Mulnivasi Publication_page-0012.jpg"

];

let currentPage = 0;

const image =
document.getElementById("pageImage");

const pageNumber =
document.getElementById("pageNumber");

function updatePage(){

    image.style.opacity = "0";

    setTimeout(()=>{

        image.src = pages[currentPage];

        pageNumber.innerHTML =
        `${currentPage + 1} / ${pages.length}`;

        image.style.opacity = "1";

    },200);

}

function nextPage(){

    if(currentPage < pages.length - 1){

        currentPage++;

        updatePage();
    }

}

function prevPage(){

    if(currentPage > 0){

        currentPage--;

        updatePage();
    }

}

/* Keyboard Navigation */

document.addEventListener("keydown",function(e){

    if(e.key === "ArrowRight"){
        nextPage();
    }

    if(e.key === "ArrowLeft"){
        prevPage();
    }

});

</script>

</body>
</html>
