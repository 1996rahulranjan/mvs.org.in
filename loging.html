<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Page</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
    padding:20px;
}

.login-container{
    width:100%;
    max-width:400px;
}

.login-box{
    background:#fff;
    padding:40px 30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.login-box h2{
    text-align:center;
    margin-bottom:10px;
    color:#1e293b;
}

.login-box p{
    text-align:center;
    color:#64748b;
    margin-bottom:25px;
    font-size:14px;
}

.input-group{
    margin-bottom:20px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    color:#334155;
    font-weight:600;
}

.input-group input{
    width:100%;
    padding:14px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    outline:none;
    font-size:15px;
    transition:.3s;
}

.input-group input:focus{
    border-color:#2563eb;
    box-shadow:0 0 10px rgba(37,99,235,0.2);
}

.login-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.login-btn:hover{
    background:#1d4ed8;
}

.extra-links{
    text-align:center;
    margin-top:20px;
}

.extra-links a{
    text-decoration:none;
    color:#2563eb;
    font-size:14px;
}

.extra-links a:hover{
    text-decoration:underline;
}

@media(max-width:480px){
    .login-box{
        padding:30px 20px;
    }

    .login-box h2{
        font-size:24px;
    }
}
</style>
</head>
<body>

<div class="login-container">
    <div class="login-box">
        <h2>Welcome Back</h2>
        <p>Please login to your account</p>

        <form>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>
        </form>

        <div class="extra-links">
            <a href="#">Forgot Password?</a>
            <br><br>
            <a href="#">Create New Account</a>
        </div>
    </div>
</div>

</body>
</html>
